plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.triplog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.triplog'
        minSdk 28
        targetSdk 33
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // للبناء فقط: الكلاس الحقيقي يأتي من نظام السيارة (uses-library autolink.sdk)
    compileOnly project(':autolink-stubs')
}
